name: CI

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck workspaces
        shell: bash
        run: |
          if compgen -G 'apps/*/package.json' > /dev/null; then
            npm run tsc --workspaces --if-present
          else
            echo 'No application workspaces yet; skipping typecheck.'
          fi
      - name: Build workspaces
        shell: bash
        run: |
          if compgen -G 'apps/*/package.json' > /dev/null; then
            npm run build --workspaces --if-present
          else
            echo 'No application workspaces yet; skipping build.'
          fi
